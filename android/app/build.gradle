plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    id 'com.google.firebase.firebase-perf'
    id 'com.google.firebase.crashlytics'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.solguruz.skelter"
    // permission_handler_android and sms_autofill need API 37 to compile.
    compileSdk = 37
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.solguruz.skelter"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        testInstrumentationRunner = "pl.leancode.patrol.PatrolJUnitRunner"
        testInstrumentationRunnerArguments["clearPackageData"] = "true"
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        // Needed by the `resValue` app_name in each product flavor.
        resValues = true
    }

    flavorDimensions "app"
    productFlavors {
        dev {
            dimension "app"
            resValue "string", "app_name", "Skelter Dev"
            versionNameSuffix "-dev"
            applicationId "com.solguruz.skelter.dev"
        }
        prod {
            dimension "app"
            resValue "string", "app_name", "Skelter"
            versionNameSuffix "-prod"
            applicationId "com.solguruz.skelter"
        }
        stage {
            dimension "app"
            resValue "string", "app_name", "Skelter Stage"
            versionNameSuffix "-stage"
            applicationId "com.solguruz.skelter.stage"
        }
    }

    testOptions {
        execution = "ANDROIDX_TEST_ORCHESTRATOR"
    }
}

flutter {
    source = "../.."
}

dependencies {
    androidTestUtil "androidx.test:orchestrator:1.5.1"
    implementation platform('com.android.billingclient:billing:7.0.0')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
    implementation 'com.google.j2objc:j2objc-annotations:3.0.0'
    implementation platform('com.android.billingclient:billing:7.0.0')
    implementation platform('com.google.firebase:firebase-bom:34.7.0')
    // When using the BoM, you don't need specify versions in Firebase library dependencies
    implementation 'com.google.firebase:firebase-perf'
}
